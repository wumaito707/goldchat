<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GoldChat</title>
<meta name="theme-color" content="#d4af37">
<link rel="manifest" href="/static/manifest.webmanifest">
<link rel="apple-touch-icon" href="/static/icons/icon-192.png">
<link rel="stylesheet" href="/static/styles.css?v=voice-composer-1">
</head>
<body>

<!-- ===== Auth screen ===== -->
<div class="auth-wrap" id="authWrap">
  <div class="auth-card">
    <div class="auth-logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5Z"/></svg>
    </div>
    <div class="auth-title"><span>Gold</span>Chat</div>
    <div class="auth-sub" id="authSub">Sign in to continue</div>
    <div class="auth-err" id="authErr"></div>

    <form id="authForm">
      <div class="field" id="nameField" style="display:none">
        <label>Display name</label>
        <input type="text" id="displayName" placeholder="Your name" autocomplete="off">
      </div>
      <div class="field">
        <label>Username, verified email</label>
        <input type="text" id="username" placeholder="e.g. jordan" autocomplete="off" required>
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="password" minlength="8" maxlength="128" placeholder="••••••••" autocomplete="off" required>
      </div>
      <button type="submit" class="btn-gold" id="authBtn">Sign In</button>
    </form>

    <div class="auth-switch">
      <span id="switchText">No account?</span>
      <a id="switchBtn">Create one</a>
    </div>
    <div class="auth-hint">
      Tip: open this page in <b>two browser tabs</b> and register two different users to chat with each other in real time.
    </div>
  </div>
</div>

<!-- ===== Main app ===== -->
<div class="app" id="app" style="display:none">
  <nav class="desktop-nav" aria-label="Main navigation">
    <button type="button" class="desktop-nav-item active" id="desktopChats" aria-label="Chats" title="Chats"><span aria-hidden="true">💬</span><small>Chats</small></button>
    <button type="button" class="desktop-nav-item" id="desktopUpdates" aria-label="Updates" title="Updates"><span aria-hidden="true">◉</span><small>Updates</small></button>
    <button type="button" class="desktop-nav-item" id="desktopCalls" aria-label="Calls" title="Calls"><span aria-hidden="true">☎</span><small>Calls</small></button>
    <button type="button" class="desktop-nav-item" id="desktopChannels" aria-label="Channels" title="Channels"><span aria-hidden="true">▣</span><small>Channels</small></button>
    <button type="button" class="desktop-nav-item desktop-nav-bottom" id="desktopSettings" aria-label="Settings" title="Settings"><span aria-hidden="true">⚙</span><small>Settings</small></button>
  </nav>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="me-avatar" id="meAvatar"></div>
      <div class="me-info">
        <div class="me-name" id="meName"></div>
        <div class="me-status online" id="meStatus">Online</div>
      </div>
      <button class="icon-btn" id="logoutBtn" title="Log out">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></svg>
      </button>
    </div>

    <div class="search-wrap">
      <div class="search-box">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <input type="text" id="searchInput" placeholder="Search chats…" />
      </div>
    </div>

    <div class="story-rail" id="storyRail" aria-label="Status updates" hidden></div>
    <div class="chat-filters" id="chatFilters" role="tablist" aria-label="Filter chats">
      <button type="button" class="chat-filter active" data-filter="all" role="tab" aria-selected="true">All</button>
      <button type="button" class="chat-filter" data-filter="unread" role="tab" aria-selected="false">Unread</button>
      <button type="button" class="chat-filter" data-filter="favorites" role="tab" aria-selected="false">Favorites</button>
      <button type="button" class="chat-filter" data-filter="direct" role="tab" aria-selected="false">People</button>
      <button type="button" class="chat-filter" data-filter="group" role="tab" aria-selected="false">Groups</button>
      <button type="button" class="chat-filter" data-filter="channel" role="tab" aria-selected="false">Channels</button>
    </div>

    <div class="chat-list" id="chatList"></div>

    <button class="fab" id="newChatBtn" title="New chat">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
    </button>
    <nav class="mobile-nav" aria-label="Mobile navigation">
      <button type="button" class="mobile-nav-item active" id="mobileChats"><span aria-hidden="true">💬</span><span>Chats</span></button>
      <button type="button" class="mobile-nav-item" id="mobileUpdates"><span aria-hidden="true">◉</span><span>Updates</span></button>
      <button type="button" class="mobile-nav-item" id="mobileCommunities"><span aria-hidden="true">♧</span><span>Communities</span></button>
      <button type="button" class="mobile-nav-item" id="mobileCalls"><span aria-hidden="true">☎</span><span>Calls</span></button>
      <button type="button" class="mobile-nav-item" id="mobileMore"><span aria-hidden="true">⋮</span><span>More</span></button>
    </nav>
  </aside>

  <main class="chat-main" id="chatMain">
    <div class="empty-state" id="emptyState">
      <div class="empty-logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5Z"/></svg>
      </div>
      <h2>Select a chat to begin</h2>
      <p>Tap the gold <b>+</b> button to start a new conversation, or pick an existing chat from the list.</p>
    </div>

    <div id="chatView" style="display:none; flex:1; flex-direction:column; min-height:0;">
      <div class="chat-header">
        <button class="icon-btn back-btn" id="backBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>
        </button>
        <div class="header-avatar" id="hAvatar"></div>
        <div class="header-info">
          <div class="header-name" id="hName"></div>
          <div class="header-status" id="hStatus"></div>
        </div>
        <div class="header-actions">
          <button class="icon-btn" id="videoCallBtn" title="Video call" aria-label="Video call">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 10 4.5-3v10L15 14"/><rect x="3" y="6" width="12" height="12" rx="2"/></svg>
          </button>
          <button class="icon-btn" id="voiceCallBtn" title="Voice call" aria-label="Voice call">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92Z"/></svg>
          </button>
        </div>
      </div>

      <div class="messages" id="messages" aria-live="polite"></div>
      <div id="replyBar" hidden></div>

      <div class="composer">
        <div class="composer-field">
        <button class="icon-btn composer-emoji" id="emojiBtn" title="Emoji" aria-label="Choose emoji">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><path d="M9 9h.01"/><path d="M15 9h.01"/></svg>
        </button>
        <textarea class="composer-input" id="composerInput" rows="1" placeholder="Message" aria-label="Message"></textarea>
        <button class="icon-btn" id="attachBtn" title="Attach" aria-label="Attach file">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.44 11.05-9.19 9.19a5 5 0 0 1-7.07-7.07l9.19-9.19a3.5 3.5 0 0 1 4.95 4.95L9.9 18.08a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
        </button>
        <button class="icon-btn" id="cameraBtn" title="Camera" aria-label="Camera">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h3l1.5-2h7L17 7h3a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2Z"/><circle cx="12" cy="13" r="3.5"/></svg>
        </button>
        </div>
        <button class="send-btn" id="sendBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>
        </button>
      </div>
    </div>
  </main>
</div>

<div class="toast" id="toast"></div>
<div id="modalRoot"></div>

<script src="/static/app.js?v=voice-composer-1" defer></script>
<script src="/static/features.js?v=voice-composer-1" defer></script>
<script src="/static/vendor/jsQR.js" defer></script>
<script src="/static/social.js?v=performance-1" defer></script>
<script src="/static/phone-permissions.js?v=1" defer></script>
<script src="/static/account-security.js?v=2" defer></script>
<script>if ('serviceWorker' in navigator) window.addEventListener('load',()=>navigator.serviceWorker.register('/service-worker.js').catch(()=>{}));</script>
</body>
</html>
