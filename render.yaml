services:
  - type: web
    name: goldchat
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: GOLDCHAT_HOST
        value: 0.0.0.0
      - key: GOLDCHAT_EMAIL_PROVIDER
        value: brevo
      - key: GOLDCHAT_VERIFICATION_SECRET
        generateValue: true
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: GOLDCHAT_STORAGE_URL
        sync: false
      - key: GOLDCHAT_STORAGE_KEY
        sync: false
      - key: GOLDCHAT_STORAGE_BUCKET
        value: goldchat-private
      - key: GOLDCHAT_EMAIL_API_KEY
        sync: false
      - key: GOLDCHAT_SMTP_FROM
        sync: false
